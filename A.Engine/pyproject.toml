[project]
name = "myangustis-engine"
version = "0.1.0"
description = "Burmese segmentation and POS engine"
requires-python = ">=3.10"
dependencies = ["cryptography>=42.0"]

[project.optional-dependencies]
native = ["Cython>=3.0,<4", "setuptools>=68"]

[project.scripts]
myangustis-build-trees = "myangustis_engine.MonoSyllabism.graph.build:main"
myangustis-build-native = "myangustis_engine.build_native:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["architecture/myangustis_engine"]
exclude = ["**/.cache-tree/**", "**/.data/**"]
