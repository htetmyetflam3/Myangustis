[project]
name = "myangustis-parser"
version = "0.2.2"
description = "Extract and normalize Burmese text from PDFs. Handles Zawgyi-encoded embedded fonts and non-standard Unicode substitutions."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Kaung Myat Thu", email = "htetmyet157@gmail.com"}
]
keywords = ["pdf", "zawgyi", "unicode", "burmese", "myanmar", "text-extraction", "font-embedding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Dictionary/master data comes from the JavaScript engine as a child process,
# so no crypto dependency is needed here. OCR uses the Tesseract CLI (external
# binary, optional): `pip install` cannot supply it.
dependencies = [
    "flask>=3.0.0",
    "fpdf2>=2.8.8",
]

[project.optional-dependencies]
pdf-linearize = ["pikepdf>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The Python parser is a flat module directory (no package __init__.py),
# imported by adding ``Python/modules`` to sys.path — the layout the CLI and
# the tests use. Include it as-is so a wheel does not claim a stale ``main/``.
[tool.hatch.build.targets.wheel]
only-include = ["Python/modules"]
sources = ["Python"]
