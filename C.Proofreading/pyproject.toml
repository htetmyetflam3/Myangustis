[project]
name = "myangustis-proofreading"
version = "1.0.0"
description = "Myangustis proofreading workflow: paragraph repair, translator integration, DOCX tagging, merge-episodes."
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "cryptography>=42.0",
    "httpx>=0.27",
    "json5>=0.9.0",
    "pikepdf>=8",
    "pypdf>=6.0",
    "python-docx>=1.1.0",
    "requests>=2.32.0",
    "selenium>=4.32.0",
    "serpapi>=0.1.5",
    "tenacity>=9.0.0",
    "trio~=0.17",
    "trio-websocket~=0.9",
    "typing_extensions~=4.9",
    "urllib3<3,>=1.26",
    "websocket-client~=1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["main"]
