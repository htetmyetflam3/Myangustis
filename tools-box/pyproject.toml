[project]
name = "myangustis-tools"
version = "1.0.0"
description = "Shared dev/ops scripts: hfinit (HuggingFace sync), regenerate-env."
requires-python = ">=3.10"
dependencies = [
    "huggingface_hub>=1.0",
    "pyarrow>=17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python"]
