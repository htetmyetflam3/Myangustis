[project]
name = "myangustis"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "cryptography>=42.0",
    "docx>=0.2.4",
    "flask>=3.0.0",
    "fpdf2>=2.8.8",
    "httpx>=0.27",
    "huggingface_hub>=1.0",
    "json5>=0.9.0",
    "pikepdf>=8",
    "pyarrow>=17",
    "pypdf>=6.0",
    "requests>=2.32.0",
    "selenium>=4.32.0",
    "serpapi>=0.1.5",
    "tenacity>=9.0.0",
    "trio~=0.17",
    "trio-websocket~=0.9",
    "typing_extensions~=4.9",
    "urllib3<3,>=1.26",
    "websocket-client~=1.8",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "C.Proofreading",
    "D.Parser",
    "E.Scraper",
    "tools-box",
]
