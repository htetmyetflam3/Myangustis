[project]
name = "myangustis-parser"
version = "0.2.2"
description = "Extract and normalize Burmese text from PDFs. Handles Zawgyi-encoded embedded fonts and non-standard Unicode substitutions."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Kaung Myat Thu", email = "htetmyet157@gmail.com"}
]
keywords = ["pdf", "zawgyi", "unicode", "burmese", "myanmar", "text-extraction", "font-embedding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "flask>=3.0.0",
    "fpdf2>=2.8.8",
]

[project.optional-dependencies]
pdf-linearize = ["pikepdf>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["main"]
